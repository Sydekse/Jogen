name: CI

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==========================================
  # 1. BACKEND CI (Django, Pytest, & Ruff)
  # ==========================================
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jogen_db
          POSTGRES_USER: jogen_user
          POSTGRES_PASSWORD: jogen_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security & Quality Scan
        run: |
          pip-audit
          ruff check .

      - name: Run Django Migrations
        env:
          POSTGRES_PORT: 5432
        run: python manage.py migrate

      - name: Run Pytest
        env:
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: pytest --ds=core.settings -v

  # ==========================================
  # 2. FRONTEND CI (Next.js, TypeScript, & ESLint)
  # ==========================================
  frontend-test:
    name: Frontend CI
    runs-on: ubuntu-latest

    # Forces all steps in this job to execute inside the frontend directory
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js Production Build
        run: npm run build