version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jogen_postgres
    environment:
      POSTGRES_DB: jogen_db
      POSTGRES_USER: jogen_user
      POSTGRES_PASSWORD: jogen_password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: jogen_redis
    ports:
      - "6379:6379"
  frontend:
    image: node:22-alpine
    container_name: jogen_frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
      - redis

volumes:
  frontend_node_modules: