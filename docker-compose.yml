version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jogen_postgres
    environment:
      POSTGRES_DB: jogen_db
      POSTGRES_USER: jogen_user
      POSTGRES_PASSWORD: jogen_password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: jogen_redis
    ports:
      - "6379:6379"