name: CI

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jogen_db
          POSTGRES_USER: jogen_user
          POSTGRES_PASSWORD: jogen_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security & Quality Scan
        run: |
          pip-audit
          ruff check .

      - name: Run Django Migrations
        env:
          DATABASE_URL: postgres://jogen_user:jogen_password@localhost:5432/jogen_db
        run: python manage.py migrate

      - name: Run Pytest
        env:
          DATABASE_URL: postgres://jogen_user:jogen_password@localhost:5432/jogen_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest --ds=core.settings -v